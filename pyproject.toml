[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "medm2garmin"
version = "0.1.0"
description = "Synchronize blood pressure measurements from MedM Health to Garmin Connect"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "medm2garmin contributors" }]
dependencies = [
  "garminconnect>=0.2.26",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.scripts]
medm2garmin = "medm2garmin.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unreachable = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "garminconnect"
ignore_missing_imports = true
